<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Phare — Ensemble contre le harcèlement</title>
<meta name="description" content="Appli pour comprendre, réagir et se protéger face au harcèlement scolaire et au cyberharcèlement, avec un espace prof. Programme pHARe.">
<meta name="theme-color" content="#EAF4FE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3E3A5B; --muted:#7A7596;
  --lav:#B9A3EC; --lav-l:#EFE8FC;
  --peach:#FFB79E; --peach-l:#FFEDE5;
  --mint:#8FD9BD; --mint-l:#E2F6EE;
  --sky:#94C8F2; --sky-l:#E4F1FD;
  --pink:#F4A3C0; --pink-l:#FDE8F0;
  --butter:#FFD970; --butter-l:#FFF6D9;
  --shadow:0 6px 22px rgba(90,80,140,.12);
  --r:24px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.5;
  background:linear-gradient(180deg,#E4F1FD 0%,#FFF6F0 38%,#FDEFF6 100%);background-attachment:fixed;min-height:100vh}
body.dys{font-family:'Lexend',sans-serif;letter-spacing:.04em;word-spacing:.12em;line-height:1.75}
body.dys h1,body.dys h2,body.dys h3{font-family:'Lexend',sans-serif}
h1,h2,h3{font-family:'Baloo 2','Nunito',sans-serif;line-height:1.15;margin:0}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:62px 16px 130px}
body.proj .wrap{max-width:1100px}

.topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(255,255,255,.75);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid rgba(185,163,236,.25)}
.brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;display:flex;align-items:center;gap:7px}
.exit{background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px}
.sos{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  background:linear-gradient(135deg,#F7A1B5,#F27D8E);color:#fff;font-weight:800;font-size:17px;border-radius:999px;
  padding:14px 26px;box-shadow:0 8px 24px rgba(242,125,142,.45);white-space:nowrap}
body.proj .sos,body.profmode .sos{display:none}

.hero{background:linear-gradient(180deg,#DCEBFB 0%,#F3E9FD 70%,#FFF 100%);border-radius:32px;padding:18px 18px 22px;box-shadow:var(--shadow);text-align:center}
.hero h1{font-size:44px;font-weight:800}
.tag{margin:4px 0 0;color:var(--muted);font-weight:700}
.lh{width:230px;max-width:70%;height:auto;display:block;margin:0 auto}
.ray{transition:opacity .9s ease}
.ray.off{opacity:.07}
.ray.on{opacity:.9;animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.9}50%{opacity:.6}}
.lantern-glow{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.55}}
.stars circle{animation:tw 3s ease-in-out infinite}
.stars circle:nth-child(2){animation-delay:.8s}.stars circle:nth-child(3){animation-delay:1.6s}.stars circle:nth-child(4){animation-delay:2.2s}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.25}}
.progress-pill{display:inline-flex;gap:10px;align-items:center;background:#fff;border-radius:999px;padding:7px 14px;margin-top:12px;font-weight:800;box-shadow:0 3px 10px rgba(90,80,140,.1);font-size:15px}
.dots{display:inline-flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:#E6E1F2;display:inline-block}
.dots i.on{background:var(--butter);box-shadow:0 0 8px #FFD970}

.section-title{font-size:24px;font-weight:800;margin:26px 4px 12px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.isle{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px;border-radius:var(--r);background:#fff;box-shadow:var(--shadow);border:3px solid transparent;position:relative;transition:transform .15s}
.isle:active{transform:scale(.98)}
.isle .ico{flex:0 0 64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px}
.isle h3{font-size:20px;font-weight:800}
.isle p{margin:2px 0 0;font-size:14.5px;color:var(--muted);font-weight:600;line-height:1.35}
.isle .num{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.isle .check{position:absolute;top:10px;right:12px;font-size:13px;font-weight:800;background:var(--butter);border-radius:999px;padding:2px 9px}
.c1 .ico{background:var(--sky-l)} .c1{border-color:var(--sky-l)} .c1 .num{color:#4C8FC7}
.c2 .ico{background:var(--peach-l)} .c2{border-color:var(--peach-l)} .c2 .num{color:#D9735A}
.c3 .ico{background:var(--lav-l)} .c3{border-color:var(--lav-l)} .c3 .num{color:#8467CC}
.c4 .ico{background:var(--mint-l)} .c4{border-color:var(--mint-l)} .c4 .num{color:#3E9E7C}
.c5 .ico{background:var(--pink-l)} .c5{border-color:var(--pink-l)} .c5 .num{color:#CF5F88}
.c6 .ico{background:var(--butter-l)} .c6{border-color:var(--butter-l)} .c6 .num{color:#A07A10}

.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:14px 0;position:relative}
.card h3{font-size:21px;font-weight:800;margin-bottom:6px;padding-right:44px}
.card p{margin:6px 0}
.tint-sky{background:var(--sky-l)} .tint-peach{background:var(--peach-l)} .tint-lav{background:var(--lav-l)}
.tint-mint{background:var(--mint-l)} .tint-pink{background:var(--pink-l)} .tint-butter{background:var(--butter-l)}
.emoji-big{font-size:34px;line-height:1;margin-bottom:6px;display:block}
ul.soft{padding-left:0;list-style:none;margin:8px 0}
ul.soft li{padding:8px 12px;background:rgba(255,255,255,.78);border-radius:14px;margin:6px 0;font-weight:600}
.signs{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
@media(min-width:560px){.signs{grid-template-columns:1fr 1fr 1fr}}
.sign{background:#fff;border-radius:18px;padding:12px;text-align:center;font-weight:700}
.sign b{display:block;font-size:28px}

.say{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(90,80,140,.15);font-size:18px;display:flex;align-items:center;justify-content:center}
.say.inline{position:static;display:inline-flex;vertical-align:middle;margin-left:6px}
.say.speaking{background:var(--butter);animation:pulse 1.2s infinite}

.mhead{border-radius:28px;padding:16px 18px 18px;box-shadow:var(--shadow);margin-bottom:6px}
.back{background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(90,80,140,.1)}
.mhead h2{font-size:30px;font-weight:800;margin-top:12px}
.mhead p{margin:4px 0 0;font-weight:600;opacity:.85}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:18px;padding:13px 18px;font-weight:800;background:var(--ink);color:#fff;box-shadow:0 4px 12px rgba(62,58,91,.2);min-height:48px;text-decoration:none}
.btn.soft{background:#fff;color:var(--ink);border:2px solid #E6E1F2;box-shadow:none}
.btn.wide{width:100%}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}

.choice{display:block;width:100%;text-align:left;background:#fff;border:3px solid #ECE7F7;border-radius:18px;padding:14px 16px;margin:10px 0;font-weight:700;line-height:1.4;transition:border-color .2s,background .2s}
.choice.best{border-color:var(--mint);background:var(--mint-l)}
.choice.mid{border-color:var(--butter);background:var(--butter-l)}
.choice.bad{border-color:var(--pink);background:var(--pink-l)}
.choice.dim{opacity:.55}
.fb{border-radius:18px;padding:14px 16px;margin:12px 0;font-weight:600}
.fb.good{background:var(--mint-l)} .fb.mid{background:var(--butter-l)} .fb.bad{background:var(--pink-l)}
.fb b{display:block;font-family:'Baloo 2',sans-serif;font-size:19px;margin-bottom:2px}
.persp{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.p-temoin{background:var(--sky-l);color:#3F7FB5} .p-victime{background:var(--pink-l);color:#C2507A} .p-suiveur{background:var(--butter-l);color:#A07A10}
.scene{font-size:18px;font-weight:700;background:var(--peach-l);border-radius:20px;padding:16px;padding-right:58px;margin:12px 0;position:relative}
.scen-list .isle .ico{font-size:30px;flex-basis:54px;height:54px}

.sortcard{background:#fff;border-radius:24px;padding:22px 52px 22px 18px;box-shadow:var(--shadow);font-size:18.5px;font-weight:700;text-align:center;min-height:120px;display:flex;align-items:center;justify-content:center;position:relative}
.bins{display:flex;gap:10px;margin-top:12px}
.bins .btn{flex:1;font-size:15.5px;padding:14px 8px}
.bin-a{background:#7FB8E6} .bin-b{background:#E98AA9}
.counter{font-weight:800;color:var(--muted);font-size:14px;text-align:center;margin:8px 0}
.bar{height:10px;background:#EEEAF7;border-radius:999px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--lav));border-radius:999px;transition:width .4s}

.gestes{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.gestes{grid-template-columns:1fr 1fr}}
.geste{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.geste h3{font-size:19px;display:flex;align-items:center;gap:8px}
.geste p{margin:4px 0 0;font-size:15.5px;font-weight:600;color:#4f4a6d}
.netbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border-radius:999px;padding:8px 14px;font-weight:800;font-size:14.5px;background:#fff;border:2px solid #E6E1F2}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.tog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border-radius:16px;padding:12px 14px;margin:8px 0;font-weight:700;border:2px solid #EEEAF7}
.tog .box{flex:0 0 28px;height:28px;border-radius:9px;border:2px solid #CFC7E6;display:flex;align-items:center;justify-content:center;font-size:16px;background:#fff}
.tog.on{border-color:var(--mint);background:var(--mint-l)}
.tog.on .box{background:var(--mint);border-color:var(--mint);color:#fff}
.shieldmeter{display:flex;align-items:center;gap:10px;font-weight:800}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;gap:4px;box-shadow:var(--shadow);margin:8px 0 4px}
.seg button{flex:1;border-radius:999px;padding:10px 8px;font-weight:800;font-size:14.5px}
.seg button.sel{background:var(--lav);color:#fff}

.contacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.contact{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:var(--shadow);font-weight:700;font-size:15px}
.contact b{display:block;font-size:30px;line-height:1.2}
.contact span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.quote{font-family:'Baloo 2',sans-serif;font-size:21px;font-weight:700;text-align:center;padding:6px 4px}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.tabs .chip{white-space:nowrap}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mood{background:#fff;border-radius:18px;padding:12px 6px;text-align:center;font-weight:800;font-size:14px;border:3px solid transparent;box-shadow:var(--shadow)}
.mood b{display:block;font-size:36px;line-height:1.2}
.mood.sel{border-color:var(--lav)}
.breath-zone{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.bubble{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#C9E4FA 45%,#B9A3EC);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;transform:scale(.7);box-shadow:0 10px 30px rgba(148,200,242,.5);transition:transform 5s ease-in-out}
.bubble.in{transform:scale(1.08)}
.field{display:block;width:100%;font-family:inherit;font-size:16.5px;padding:12px 14px;border-radius:14px;border:2px solid #E6E1F2;margin:6px 0 10px;background:#fff;color:var(--ink)}
.field:focus{outline:none;border-color:var(--lav)}
textarea.field{min-height:90px;font-size:13px;font-family:monospace}
label.lbl,.lbl{font-weight:800;font-size:15px}
.msgout{background:var(--lav-l);border-radius:18px;padding:14px 16px;font-weight:700;font-size:17.5px;min-height:56px}
.reveal{background:var(--mint-l);border-radius:16px;padding:12px 14px;font-weight:600;margin-top:8px}
.levelpick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}

.overlay{position:fixed;inset:0;background:rgba(62,58,91,.35);z-index:60;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#FFFBF8;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(28px + env(safe-area-inset-bottom));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#DCD5EE;margin:0 auto 12px}
.big3018{display:block;text-align:center;background:linear-gradient(135deg,#F7A1B5,#F27D8E);color:#fff;border-radius:24px;padding:18px;text-decoration:none;box-shadow:0 8px 20px rgba(242,125,142,.35)}
.big3018 b{display:block;font-family:'Baloo 2',sans-serif;font-size:46px;line-height:1}
.big3018 span{font-weight:700;font-size:15px}
.numlist a,.numlist div{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:11px 14px;margin:8px 0;text-decoration:none;font-weight:700;box-shadow:0 2px 8px rgba(90,80,140,.08)}
.numlist .n{flex:0 0 64px;text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;border-radius:12px;padding:4px 0}
.numlist small{display:block;font-weight:600;color:var(--muted);font-size:13.5px}

.toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-20px);background:#fff;border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:var(--shadow);z-index:70;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.foot{text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;margin-top:26px}
.settings{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.settings .chip{font-size:13.5px}
.confirmbox{background:var(--pink-l);border-radius:18px;padding:14px;margin-top:10px;text-align:center;font-weight:700}
.final{background:linear-gradient(180deg,#FFF6D9,#FDE8F0);border-radius:28px;padding:18px;box-shadow:var(--shadow);text-align:center;margin-top:18px}
.final h3{font-size:24px}
.fade{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Espace prof */
.profbadge{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.seance{background:#fff;border-radius:20px;box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.seance > button{display:flex;width:100%;text-align:left;gap:12px;align-items:center;padding:14px 16px}
.seance .sn{flex:0 0 44px;height:44px;border-radius:14px;background:var(--lav-l);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px}
.seance h3{font-size:18px}
.seance small{display:block;color:var(--muted);font-weight:700;font-size:13.5px}
.seance .body{padding:0 16px 16px}
.steps{list-style:none;padding:0;margin:8px 0}
.steps li{display:flex;gap:10px;padding:9px 0;border-top:1px dashed #E6E1F2;font-weight:600;font-size:15.5px}
.steps li b{flex:0 0 64px;font-family:'Baloo 2',sans-serif;color:#8467CC}
.kv{font-size:15px;margin:6px 0}
.kv b{color:#8467CC}
.cfgrow{background:#fff;border-radius:16px;padding:10px 12px;margin:8px 0;box-shadow:0 2px 8px rgba(90,80,140,.08)}
.cfgrow .two{display:flex;gap:8px}
.cfgrow .two .field{margin:4px 0}
.warn{background:var(--butter-l);border-radius:16px;padding:12px 14px;font-weight:600;font-size:15px}

/* Projection */
body.proj{font-size:21px}
.pscene{font-size:28px;font-weight:800;line-height:1.35;background:var(--peach-l);border-radius:28px;padding:26px;margin:14px 0}
.popts{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.popts{grid-template-columns:1fr 1fr}}
.popt{background:#fff;border:4px solid #ECE7F7;border-radius:24px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.popt .L{flex:0 0 52px;height:52px;border-radius:16px;background:var(--lav-l);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px}
.popt .tx{flex:1;font-weight:700;font-size:21px;line-height:1.35}
.popt .fbp{display:block;font-weight:600;font-size:17px;margin-top:8px}
.popt.best{border-color:var(--mint);background:var(--mint-l)} .popt.mid{border-color:var(--butter);background:var(--butter-l)} .popt.bad{border-color:var(--pink);background:var(--pink-l)}
.vote{display:flex;align-items:center;gap:6px;margin-top:10px}
.vote button{width:40px;height:40px;border-radius:12px;background:var(--lav-l);font-weight:800;font-size:22px}
.vote span{min-width:40px;text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px}
.qbox{background:var(--sky-l);border-radius:24px;padding:18px 22px;margin-top:16px;font-size:22px;font-weight:700}
.qbox li{margin:8px 0}
.psort{font-size:32px;font-weight:800;text-align:center;background:#fff;border-radius:28px;padding:40px 24px;box-shadow:var(--shadow);line-height:1.35}

/* Icônes maison */
.ic{display:block;flex-shrink:0}
.hic{display:flex;align-items:center;gap:10px}
.hic.sm{gap:8px;font-size:15px}
.emoji-big{display:block;margin-bottom:8px}
.sign b,.mood b{display:flex;justify-content:center;margin-bottom:4px}
.contact b{display:flex;justify-content:center;margin-bottom:6px}
.geste h3{gap:10px}
.sos{display:flex;align-items:center;gap:8px}
.pscene .pic{display:inline-block;vertical-align:-12px;margin-right:12px}
.numlist .n .ic{margin:0 auto}
ul.soft li{position:relative;padding-left:34px}
ul.soft li::before{content:"";position:absolute;left:13px;top:16px;width:9px;height:9px;border-radius:50%;background:var(--lav)}
.tint-lav ul.soft li::before{background:#E98AA9}
.tint-pink ul.soft li::before{background:#A98BE6}
.tint-mint ul.soft li::before{background:#5CC39C}
.tint-sky ul.soft li::before{background:#6FAEE3}
.tint-butter ul.soft li::before{background:#F0B93A}
.tint-peach ul.soft li::before{background:#F08F70}
.section-title{position:relative;padding-bottom:8px}
.section-title::after{content:"";position:absolute;left:4px;bottom:0;width:46px;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--pink),var(--lav))}
.isle .check{background:var(--butter-l);border:2px solid var(--butter);font-size:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.topbar,.sos,.back,.btn,.say{display:none!important}body{background:#fff}.wrap{padding-top:0}}
</style>
</head>

  return '<button class="say' + (inline ? ' inline' : '') + '" data-act="say" data-arg="' + id + '" aria-label="Écouter le texte">' + ic('speaker', 24) + '</button>';
}
function youngLevel(){ return S.niveau === '6e' || S.niveau === '5e'; }

/* ---------- Lecture à voix haute ---------- */
var speakingBtn = null;
function stopSpeak(){
  if(CAN_SPEAK){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  if(speakingBtn){ speakingBtn.className = speakingBtn.className.replace(' speaking', ''); speakingBtn = null; }
}
function speak(id, btn){
  if(!CAN_SPEAK){ return; }
  var was = speakingBtn === btn;
  stopSpeak();
  if(was){ return; }
  var el = document.getElementById(id);
  if(!el){ return; }
  var txt = (el.innerText || el.textContent || '');
  txt = txt.replace(/[\uD800-\uDFFF]|[-]||/g, ' ').replace(/«|»/g, '').replace(/\s+/g, ' ');
  var u = new window.SpeechSynthesisUtterance(txt);
  u.lang = 'fr-FR'; u.rate = 0.95;
  try{
    var vs = window.speechSynthesis.getVoices();
    for(var i=0;i<vs.length;i++){ if(vs[i].lang && vs[i].lang.toLowerCase().indexOf('fr') === 0){ u.voice = vs[i]; break; } }
  }catch(e){}
  u.onend = function(){ if(speakingBtn === btn){ stopSpeak(); } };
  speakingBtn = btn; btn.className += ' speaking';
  window.speechSynthesis.speak(u);
}

/* =================== RESPIRATION =================== */
function stopBreath(){ if(breathTimer){ clearInterval(breathTimer); breathTimer = null; } }
function startBreath(){
  stopBreath();
  var b = document.getElementById('bubble'), cnt = document.getElementById('bcount'), btn = document.getElementById('bbtn');
  if(!b){ return; }
  var phase = 0, cycles = 6;
  btn.disabled = true;
  function step(){
    if(phase >= cycles * 2){
      stopBreath(); b.className = 'bubble'; b.textContent = 'Bravo ';
      cnt.textContent = 'Une minute rien que pour toi.'; btn.disabled = false; btn.textContent = '↺ Recommencer';
      markAct('respire'); return;
    }
    if(phase % 2 === 0){ b.className = 'bubble in'; b.textContent = 'Inspire…'; } else { b.className = 'bubble'; b.textContent = 'Expire…'; }
    cnt.textContent = 'Respiration ' + (Math.floor(phase / 2) + 1) + ' / ' + cycles;
    phase++;
  }
  step();
  breathTimer = setInterval(step, 5000);
}
function markAct(k){
  if(!S.m5act[k]){
    S.m5act[k] = true; save();
    if(m5count() >= 3 && !S.done.m5){ finishModule('m5'); }
    var c = document.getElementById('m5count'); if(c){ c.textContent = m5countText(); }
    var tb = document.getElementById('tab-' + k); if(tb && tb.textContent.indexOf('✓') < 0){ tb.textContent = tb.textContent + ' ✓'; }
  }
}

  else if(v === 'prof'){ h = vProf(); } else if(v === 'pseances'){ h = vSeances(); } else if(v === 'pproj'){ h = vProjMenu(); }
  else if(v === 'pscen'){ h = vProjScen(); } else if(v === 'psort'){ h = vProjSort(); } else if(v === 'pconf'){ h = vConf(); }
  else if(v === 'pcfg'){ h = vCfg(); } else if(v === 'ppres'){ h = vPres(); } else if(v === 'pres'){ h = vRes(); } else if(v === 'pfam'){ h = vFam(); }
  applyBody();
  app.innerHTML = h;
  window.scrollTo(0, keepScroll ? y : 0);
}
function go(v){ ui.view = v; ui.reset = false; render(false); }
function scrollToId(id){ var el = document.getElementById(id); if(el && el.scrollIntoView){ el.scrollIntoView({behavior:'smooth', block:'start'}); } }
function baseUrl(){ return window.location.href.split('#')[0].split('?')[0]; }

/* =================== ACTIONS =================== */
function act(a, arg, el){
  if(a === 'exit'){ try{ window.location.replace('https://www.google.fr/search?q=m%C3%A9t%C3%A9o'); }catch(e){ window.location.href = 'https://www.google.fr'; } return; }
  if(a === 'help'){ stopSpeak(); document.getElementById('helpSheet').innerHTML = helpHTML(); document.getElementById('help').className = 'overlay show'; return; }
  if(a === 'closehelp'){ document.getElementById('help').className = 'overlay'; return; }
  if(a === 'say'){ speak(arg, el); return; }
  if(a === 'home'){ go('home'); return; }
  if(a === 'go'){ if(arg === 'm1'){ ui.m1ans = null; } if(arg === 'm3'){ ui.m3ans = null; } if(arg === 'pcfg'){ ui.draft = null; ui.link = ''; } go(arg); return; }
  if(a === 'niveau'){ S.niveau = S.niveau === arg ? '' : arg; ui.m3mode = null; save(); render(true); return; }
  if(a === 'dys'){ S.dys = !S.dys; save(); render(true); return; }
  if(a === 'askreset'){ ui.reset = true; render(true); return; }
  if(a === 'noreset'){ ui.reset = false; render(true); return; }
  if(a === 'doreset'){
    var d = S.dys, nv = S.niveau; S = blank(); S.dys = d; S.niveau = nv; save();
    ui.reset = false; ui.m1i = 0; ui.m1score = 0; ui.m3i = 0; ui.m3score = 0; ui.plan = {}; ui.plan3018 = false; ui.emp = {};
    toast('Progression effacée'); render(false); return;
  }
  /* Île 1 */
  if(a === 'm1pick'){ ui.m1ans = parseInt(arg, 10); if(ui.m1ans === D.m1sort[ui.m1i].a){ ui.m1score++; } render(true); return; }
  if(a === 'm1next'){
    ui.m1i++; ui.m1ans = null;
    if(ui.m1i >= D.m1sort.length){ if(ui.m1score > S.m1best){ S.m1best = ui.m1score; save(); } finishModule('m1'); }
    render(true); scrollToId('tri'); return;
  }
  if(a === 'm1again'){ ui.m1i = 0; ui.m1score = 0; ui.m1ans = null; render(true); scrollToId('tri'); return; }
  /* Île 2 */
  if(a === 'scen'){ ui.scen = parseInt(arg, 10); var sc = D.scenarios[ui.scen]; ui.scenPick = S.scen[sc.id] !== undefined ? S.scen[sc.id] : null; go('scen'); return; }
  if(a === 'spick'){
    if(ui.scenPick !== null){ return; }
    var sc2 = D.scenarios[ui.scen];
    ui.scenPick = parseInt(arg, 10);
    var prev = S.scen[sc2.id];
    if(prev === undefined || sc2.choices[ui.scenPick].v >= sc2.choices[prev].v){ S.scen[sc2.id] = ui.scenPick; }
    save();
    var all = true; for(var i=0;i<D.scenarios.length;i++){ if(S.scen[D.scenarios[i].id] === undefined){ all = false; } }
    if(all){ finishModule('m2'); }
    render(true);
    var fbx = document.getElementById('fbx'); if(fbx && fbx.scrollIntoView){ fbx.scrollIntoView({behavior:'smooth', block:'center'}); }
    return;
  }
  if(a === 'sretry'){ ui.scenPick = null; render(true); return; }
  /* Île 3 */
  if(a === 'm3mode'){ ui.m3mode = arg; render(true); return; }
  if(a === 'net'){ ui.net = arg; render(true); return; }
  if(a === 'shield'){ S.shield[arg] = !S.shield[arg]; save(); render(true); return; }
  if(a === 'm3pick'){ ui.m3ans = arg === '1'; if(ui.m3ans === D.m3quiz[ui.m3i].a){ ui.m3score++; } render(true); return; }
  if(a === 'm3next'){
    ui.m3i++; ui.m3ans = null;
    if(ui.m3i >= D.m3quiz.length){ if(ui.m3score > S.m3best){ S.m3best = ui.m3score; save(); } finishModule('m3'); }
    render(true); scrollToId('quiz'); return;
  }
  if(a === 'm3again'){ ui.m3i = 0; ui.m3score = 0; ui.m3ans = null; render(true); scrollToId('quiz'); return; }
  /* Île 4 */
  if(a === 'plan'){ ui.plan[arg] = !ui.plan[arg]; render(true); return; }
  if(a === 'plan3018'){ ui.plan3018 = !ui.plan3018; render(true); return; }
  if(a === 'planok'){ ui.replan = false; if(S.done.m4){ toast('Plan prêt !'); } else { finishModule('m4'); } render(true); return; }
  if(a === 'replan'){ ui.plan = {}; ui.plan3018 = false; ui.replan = true; render(true); return; }
  /* Île 5 */
  if(a === 'tab'){ ui.m5tab = arg; render(true); return; }
  if(a === 'mood'){ ui.mood = parseInt(arg, 10); markAct('meteo'); render(true); return; }
  if(a === 'breath'){ startBreath(); return; }
  if(a === 'feel'){ ui.mc.b = arg; render(true); checkMessage(); return; }
  if(a === 'emp'){
    ui.emp[arg] = true;
    var n = 0; for(var e in ui.emp){ if(ui.emp.hasOwnProperty(e)){ n++; } }
    if(n >= D.empathie.length){ markAct('place'); }
    render(true); return;
  }
  /* Charte */
  if(a === 'charte'){
    S.charte[arg] = !S.charte[arg]; save();
    var cc = 0; for(var k=0;k<D.charte.length;k++){ if(S.charte[k]){ cc++; } }
    if(cc === D.charte.length && S.charte[arg]){ toast('Charte signée. Merci !'); }
    render(true); return;
  }
  /* Prof */
  if(a === 'seance'){ var si = parseInt(arg, 10); ui.openSeance = ui.openSeance === si ? -1 : si; render(true); return; }
  if(a === 'pscen'){ ui.pscen = parseInt(arg, 10); ui.pvotes = [0,0,0,0]; ui.preveal = false; go('pscen'); return; }
  if(a === 'pvote'){ var pa = arg.split('|'), ix = parseInt(pa[0], 10); ui.pvotes[ix] = Math.max(0, ui.pvotes[ix] + parseInt(pa[1], 10)); render(true); return; }
  if(a === 'preveal'){ ui.preveal = true; render(true); return; }
  if(a === 'psortgo'){ ui.psort = 0; ui.psortReveal = false; go('psort'); return; }
  if(a === 'psortrev'){ ui.psortReveal = true; render(true); return; }
  if(a === 'psortnav'){ ui.psort += parseInt(arg, 10); ui.psortReveal = false; render(false); return; }
  if(a === 'cfgsave'){
    CFG = cleanCfg(ui.draft);
    try{ localStorage.setItem(KEYCFG, JSON.stringify(CFG)); toast('Enregistré sur cet appareil'); }catch(e){ toast('Enregistrement impossible sur ce navigateur'); }
    return;
  }
  if(a === 'cfgreset'){
    ui.draft = JSON.parse(JSON.stringify(CFG0)); CFG = CFG0; ui.link = '';
    try{ localStorage.removeItem(KEYCFG); }catch(e){}
    toast('Modèle rétabli'); render(true); return;
  }
  if(a === 'cfglink'){ ui.link = baseUrl() + '?c=' + encodeURIComponent(b64enc(JSON.stringify(cleanCfg(ui.draft)))); render(true); return; }
  if(a === 'copytext'){
    var src = document.getElementById(arg);
    var txt = '';
    if(src){
      var parts = [];
      var nodes = src.querySelectorAll('h3, p, li');
      for(var q=0;q<nodes.length;q++){ parts.push((nodes[q].tagName === 'LI' ? '- ' : (nodes[q].tagName === 'H3' ? '' : '\n')) + (nodes[q].innerText || nodes[q].textContent)); }
      txt = parts.join('\n');
    }
    var ok = function(){ toast('Texte copié'); };
    var ko = function(){ toast('Sélectionnez le texte et copiez-le'); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok, ko); } else { ko(); }
    return;
  }
  if(a === 'copylink'){
    var box = document.getElementById('linkbox');
    var done = function(){ toast('Lien copié'); };
    var fallback = function(){ try{ box.focus(); box.select(); box.setSelectionRange(0, 99999); if(document.execCommand('copy')){ done(); } else { toast('Sélectionnez le lien et copiez-le'); } }catch(e){ toast('Sélectionnez le lien et copiez-le'); } };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ui.link).then(done, fallback); } else { fallback(); }
    return;
  }
}

/* =================== ÉCOUTEURS =================== */
document.addEventListener('click', function(e){
  var el = e.target;
  while(el && el.nodeType === 1 && !el.getAttribute('data-act')){ el = el.parentNode; }
  if(!el || el.nodeType !== 1 || el.disabled){ return; }
  act(el.getAttribute('data-act'), el.getAttribute('data-arg'), el);
});
document.getElementById('help').addEventListener('click', function(e){ if(e.target === this){ this.className = 'overlay'; } });
document.addEventListener('input', function(e){
  var t = e.target;
  if(t.id === 'mca' || t.id === 'mcc'){
    if(t.id === 'mca'){ ui.mc.a = t.value; } else { ui.mc.c = t.value; }
    var out = document.getElementById('mcout'); if(out){ out.textContent = mcText(); }
    checkMessage(); return;
  }
  var key = t.getAttribute && t.getAttribute('data-cfg');
  if(key && ui.draft){
    if(key === 'etab'){ ui.draft.etablissement = t.value; }
    else { var pp = key.split('|'); ui.draft.contacts[parseInt(pp[1], 10)][pp[0]] = t.value; }
    ui.link = ''; var lb = document.getElementById('linkbox'); if(lb){ lb.value = 'Configuration modifiée : recréez le lien.'; }
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' || e.keyCode === 27){ document.getElementById('help').className = 'overlay'; }
  if((ui.view === 'pscen' || ui.view === 'psort') && (e.keyCode === 39 || e.keyCode === 37)){
    var dir = e.keyCode === 39 ? 1 : -1;
    if(ui.view === 'pscen'){ var ni = ui.pscen + dir; if(ni >= 0 && ni < D.scenarios.length){ act('pscen', String(ni)); } }
    else { var nj = ui.psort + dir; if(nj >= 0 && nj < D.m1sort.length){ act('psortnav', String(dir)); } }
  }
});
if(CAN_SPEAK){ try{ window.speechSynthesis.getVoices(); }catch(e){} }

render(false);
})();
</script>
